<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PBL 教案辅助生成系统</title>
    <style>
        :root {
            --lark-blue: #3370FF;
            --lark-blue-hover: #1F55E6;
            --text-main: #1F2329;
            --text-desc: #8F959E;
            --border-color: #DEE1E5;
            --bg-body: #F5F6F7;
            --bg-content: #FFFFFF;
            --danger-red: #F54A45;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .lark-container {
            background-color: var(--bg-content);
            width: 100%;
            max-width: 800px;
            padding: 5px 40px 40px 40px;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(31, 35, 41, 0.05);
        }

        h2.main-title { font-size: 24px; font-weight: 600; margin-bottom: 32px; }

        .form-group { margin-bottom: 24px; }
        label.field-label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; }

        .ilo-item {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            align-items: center;
        }

        input[type="text"] {
            width: 100%;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 10px 14px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--lark-blue);
            box-shadow: 0 0 0 3px rgba(51, 112, 255, 0.1);
        }

        .btn {
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-add {
            background-color: transparent;
            color: var(--lark-blue);
            padding: 4px 0;
            margin-top: -8px;
            margin-bottom: 16px;
        }
        .btn-add:hover { color: var(--lark-blue-hover); }

        .btn-delete {
            background-color: transparent;
            color: var(--text-desc);
            font-size: 18px;
            padding: 0 8px;
        }
        .btn-delete:hover { color: var(--danger-red); }

        .submit-btn {
            background-color: var(--lark-blue);
            color: white;
            padding: 10px 24px;
            width: 100%;
        }
        .submit-btn:hover { background-color: var(--lark-blue-hover); }
        .submit-btn:disabled { background-color: #BBBFCD; }

        /* --- 核心修改：结果区域滚动条样式 --- */
        #response-container {
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 15px;
            margin-top: 15px;

            /* 设置固定高度或最大高度 */
            height: 300px;
            overflow-y: auto; /* 纵向自动显示滚动条 */

            background-color: #fafbfc; /* 轻微底色区分 */
            font-size: 14px;
            line-height: 1.8;
            white-space: pre-wrap;
            scroll-behavior: smooth; /* 丝滑滚动 */
        }

        /* 自定义滚动条样式（飞书风格） */
        #response-container::-webkit-scrollbar {
            width: 6px;
        }
        #response-container::-webkit-scrollbar-thumb {
            background: #DEE1E5;
            border-radius: 10px;
        }
        #response-container::-webkit-scrollbar-thumb:hover {
            background: #BBBFCD;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 14px;
            background-color: var(--lark-blue);
            animation: blink 1s infinite;
            display: none;
        }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

<div class="lark-container" id="form-container">
    <h2 class="main-title">PBL教案智能生成系统</h2>

    <div class="form-group">
        <label class="field-label">教学目标 (ILO)</label>
        <div id="ilo-container">
            <div class="ilo-item">
                <input type="text" class="ilo-input" placeholder="例如：描述高血压的临床表现">
                <button class="btn btn-delete" onclick="removeILO(this)" style="visibility: hidden;">×</button>
            </div>
        </div>
        <button class="btn btn-add" onclick="addILO()">+ 添加另一个教学目标</button>
    </div>

    <div class="form-group">
        <label class="field-label">课程名称</label>
        <input type="text" id="course_input" placeholder="例如：内科学">
    </div>

    <div class="form-group">
        <label class="field-label">班级信息</label>
        <input type="text" id="class_input" placeholder="例如：21级临床2班">
    </div>

    <button id="submit_btn" class="btn submit-btn" onclick="submitRequest()">生成教案</button>

    <div id="response-container">
        <span id="response-content" style="color: #8F959E;">等待生成内容...</span>
        <span class="cursor" id="cursor"></span>
    </div>
</div>

<script src="logic.js">
</script>

</body>
</html>
